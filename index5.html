<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro Enviado</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff8f0;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: #ffffff;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(211, 84, 0, 0.15);
      max-width: 500px;
      width: 100%;
    }

    .icon {
      font-size: 4rem;
      color: #27ae60;
      margin-bottom: 1rem;
    }

    h1 {
      color: #d35400;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .btn {
      background-color: #d35400;
      color: white;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #a84300;
    }

    @media (max-width: 480px) {
      .container {
        margin: 1rem;
        padding: 2rem 1rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container" role="alert" aria-live="polite">
    <div class="icon">✅</div>
    <h1>Cadastro enviado com sucesso!</h1>
    <p>Seu formulário foi recebido. Em breve entraremos em contato para confirmar os dados e agendar a consulta.</p>
    <a href="#" class="btn">Voltar ao início</a>
  </div>

</body>
</html>
