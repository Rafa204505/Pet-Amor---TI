<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadastro Pet Shop</title>
<style>
  /* Reset básico */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fff8f0;
    color: #222;
    padding: 1rem;
    line-height: 1.6;
  }
  h1 {
    text-align: center;
    margin-bottom: 2rem;
    font-weight: 700;
    color: #d35400;
    font-size: 2.5rem;
  }
  .container {
    max-width: 750px;
    margin: 0 auto;
    padding: 2rem 2.5rem;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(211, 84, 0, 0.2);
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 1.8rem;
  }
  fieldset {
    border: 2px solid #d35400;
    border-radius: 10px;
    padding: 1.5rem 2rem 2rem;
  }
  legend {
    font-weight: 700;
    color: #d35400;
    font-size: 1.3rem;
    padding: 0 0.5rem;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.4rem;
    font-size: 1rem;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="number"],
  input[type="password"],
  select,
  textarea {
    width: 100%;
    padding: 0.6rem 1rem;
    font-size: 1rem;
    border: 2px solid #ccc;
    border-radius: 8px;
    transition: border-color 0.3s ease;
  }
  input[type="text"]:focus,
  input[type="email"]:focus,
  input[type="tel"]:focus,
  input[type="number"]:focus,
  input[type="password"]:focus,
  select:focus,
  textarea:focus {
    border-color: #d35400;
    outline-offset: 2px;
    outline: 3px solid #f9ca24;
  }
  textarea {
    min-height: 80px;
    resize: vertical;
  }
  .form-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .form-group {
    flex: 1 1 45%;
    min-width: 220px;
  }
  /* Garantir boa legibilidade no botão */
  button[type="submit"] {
    background-color: #d35400;
    color: white;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 1rem 1.2rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.25s ease;
  }
  button[type="submit"]:hover,
  button[type="submit"]:focus {
    background-color: #a84300;
    outline: none;
  }

  /* Responsividade */
  @media (max-width: 600px) {
    .form-row {
      flex-direction: column;
    }
    .form-group {
      flex: 1 1 100%;
      min-width: auto;
    }
  }
</style>
</head>
<body>

  <h1>Cadastro Pet Shop</h1>

  <div class="container" role="main">
    <form action="#" method="post" novalidate aria-label="Formulário de cadastro para pet shop">

      <fieldset>
        <legend>Dados do Tutor</legend>

        <div class="form-group">
          <label for="nome-tutor">Nome Completo <span aria-hidden="true">*</span></label>
          <input type="text" id="nome-tutor" name="nome-tutor" placeholder="Seu nome completo" required aria-required="true" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF <span aria-hidden="true">*</span></label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required aria-required="true" aria-describedby="cpfHelp" />
            <small id="cpfHelp" style="font-size: 0.8rem; color:#666;">Formato: 000.000.000-00</small>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone <span aria-hidden="true">*</span></label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 91234-5678" required aria-required="true" aria-describedby="telHelp" />
            <small id="telHelp" style="font-size: 0.8rem; color:#666;">Inclua DDD e número</small>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" placeholder="exemplo@email.com" required aria-required="true" />
        </div>

        <div class="form-group">
          <label for="endereco">Endereço Completo <span aria-hidden="true">*</span></label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade" required aria-required="true" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Dados do Pet</legend>

        <div class="form-group">
          <label for="nome-pet">Nome do Pet <span aria-hidden="true">*</span></label>
          <input type="text" id="nome-pet" name="nome-pet" placeholder="Nome do seu pet" required aria-required="true" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="especie">Espécie <span aria-hidden="true">*</span></label>
            <select id="especie" name="especie" required aria-required="true">
              <option value="" disabled selected>Selecione</option>
              <option value="cachorro">Cachorro</option>
              <option value="gato">Gato</option>
              <option value="passaro">Pássaro</option>
              <option value="roedor">Roedor</option>
              <option value="reptil">Réptil</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="raca">Raça</label>
            <input type="text" id="raca" name="raca" placeholder="Raça do pet" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="sexo">Sexo <span aria-hidden="true">*</span></label>
            <select id="sexo" name="sexo" required aria-required="true">
              <option value="" disabled selected>Selecione</option>
              <option value="macho">Macho</option>
              <option value="femea">Fêmea</option>
            </select>
          </div>

          <div class="form-group">
            <label for="idade">Idade (anos) <span aria-hidden="true">*</span></label>
            <input type="number" id="idade" name="idade" placeholder="Idade em anos" min="0" max="50" required aria-required="true" />
          </div>
        </div>

        <div class="form-group">
          <label for="peso">Peso (kg) <span aria-hidden="true">*</span></label>
          <input type="number" id="peso" name="peso" placeholder="Peso em kg" min="0" step="0.1" required aria-required="true" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Informações Médicas</legend>

        <div class="form-group">
          <label for="vacinacao">Vacinação</label>
          <textarea id="vacinacao" name="vacinacao" placeholder="Informe as vacinas recebidas" rows="4" aria-describedby="vacHelp"></textarea>
          <small id="vacHelp" style="font-size: 0.8rem; color:#666;">Exemplo: Vacina antirrábica, múltipla, etc.</small>
        </div>

        <div class="form-group">
          <label for="alergias">Alergias</label>
          <textarea id="alergias" name="alergias" placeholder="Informe alergias conhecidas" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label for="condicoes">Condições especiais</label>
          <textarea id="condicoes" name="condicoes" placeholder="Informe condições especiais de saúde" rows="4"></textarea>
        </div>
      </fieldset>

    

      <button type="submit">Cadastrar</button>
    </form>
  </div>

</body>
</html>
